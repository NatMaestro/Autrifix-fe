openapi: 3.0.3
info:
  title: AutriFix API
  version: 1.0.0
  description: 'Roadside assistance marketplace: customers, providers, real-time jobs.
    MVP auth: `POST /api/v1/auth/register/` with **email** + **phone** + **password**;
    `POST /api/v1/auth/login/` with **identifier** (email or E.164 phone) + **password**;
    `POST /api/v1/auth/google/` with Google **id_token**. Legacy SMS OTP endpoints
    remain for future use.'
paths:
  /api/v1/admin/jobs/:
    get:
      operationId: admin_jobs_list
      description: Every job, newest first — the operational view for answering "what
        happened here?".
      summary: Job history
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminJobList'
          description: ''
  /api/v1/admin/stats/:
    get:
      operationId: admin_stats_retrieve
      summary: Operational counts
      tags:
      - administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      summary: Search users
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Match name, email, or phone.
      - in: query
        name: role
        schema:
          type: string
        description: Filter by role.
      tags:
      - administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/v1/admin/verifications/:
    get:
      operationId: admin_verifications_list
      description: |-
        Submissions awaiting a decision, oldest first.

        Oldest first because this is a queue someone works through, and newest-first quietly
        starves the people who have waited longest — which is the complaint verification delays
        generate (SPEC-013 OQ-013-D).
      summary: Verification review queue
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by submission status. Defaults to `pending`.
      tags:
      - administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminVerificationList'
          description: ''
  /api/v1/admin/verifications/{id}/review/:
    post:
      operationId: admin_verifications_review_create
      summary: Approve or decline a verification submission
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVerificationReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminVerificationReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminVerificationReviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVerification'
          description: ''
  /api/v1/ai/diagnostics/:
    post:
      operationId: ai_diagnostics_create
      description: |-
        POST body: { "symptoms": "...", "vehicle": { "make": "...", "model": "..." } }
        Returns heuristic diagnostics (replace with LLM + RAG in production).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiagnosticsRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiagnosticsRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsResponse'
          description: ''
  /api/v1/ai/matching/preview/:
    post:
      operationId: ai_matching_preview_create
      description: |-
        Rank providers for a service request.

        Scoped to the request's own customer (or staff). It previously accepted any
        ``service_request_id`` from any authenticated user and returned nearby providers for
        it (``specs/006-matching-discovery.md`` SECGAP-006-3).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingPreviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MatchingPreviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MatchingPreviewRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingPreviewResponse'
          description: ''
  /api/v1/ai/route-issue/:
    post:
      operationId: ai_route_issue_create
      description: Hybrid issue routing (rules + incremental ML).
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRouteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueRouteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueRouteRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueRouteResponse'
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Verify a Google **id_token** (GIS credential) and return JWT **access**
        / **refresh**.
      summary: Sign in with Google
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthTokens'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate with **identifier** (email or E.164 phone) and **password**.
        You may send **email** or **phone** instead of **identifier** if exactly one
        is non-empty. Returns JWT **access** and **refresh**.
      summary: Login (password)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIdentifierRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginIdentifierRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginIdentifierRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierTokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Blacklist the **refresh** token. Send `{"refresh": "..."}` in
        the body.'
      summary: Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh-token/:
    post:
      operationId: auth_refresh_token_create
      description: 'Body: `{"refresh": "<refresh token>"}` — returns new **access**
        (and optionally rotated **refresh**).'
      summary: Refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account with **email**, **phone**, and **password**.
        Both email and phone are required; you can sign in later with either plus
        password. Returns profile fields and JWT tokens.
      summary: Register (password)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEmailPhoneRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterEmailPhoneRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterEmailPhoneRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/send-otp/:
    post:
      operationId: auth_send_otp_create
      description: Sends a 6-digit code via SMS (console/log in dev). Rate-limited;
        code expires in 5 minutes.
      summary: Send OTP (SMS)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPSentResponse'
          description: ''
  /api/v1/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: Verify the SMS code. **Creates** a user on first success (passwordless)
        or logs in an existing user. Optional **role** (`customer` | `provider`) applies
        only when the account is created.
      summary: Verify OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerifyTokens'
          description: ''
  /api/v1/chat/:
    get:
      operationId: chat_list
      description: Chat rooms for jobs where the user is the customer or the assigned
        provider.
      summary: List my chat rooms
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatRoomListList'
          description: ''
  /api/v1/chat/jobs/{job_id}/:
    get:
      operationId: chat_jobs_retrieve
      description: Read a conversation. Restricted to the job's two participants.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoom'
          description: ''
  /api/v1/chat/jobs/{job_id}/messages/:
    post:
      operationId: chat_jobs_messages_create
      description: Post a message. Restricted to the job's two participants.
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
  /api/v1/customers/profile/:
    get:
      operationId: customers_profile_retrieve
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
          description: ''
    put:
      operationId: customers_profile_update
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
          description: ''
    patch:
      operationId: customers_profile_partial_update
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
          description: ''
  /api/v1/customers/vehicles/:
    get:
      operationId: customers_vehicles_list
      description: Vehicles are always scoped to the calling customer's own garage.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleList'
          description: ''
    post:
      operationId: customers_vehicles_create
      description: Vehicles are always scoped to the calling customer's own garage.
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
  /api/v1/customers/vehicles/{id}/:
    get:
      operationId: customers_vehicles_retrieve
      description: Vehicles are always scoped to the calling customer's own garage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    put:
      operationId: customers_vehicles_update
      description: Vehicles are always scoped to the calling customer's own garage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    patch:
      operationId: customers_vehicles_partial_update
      description: Vehicles are always scoped to the calling customer's own garage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    delete:
      operationId: customers_vehicles_destroy
      description: Vehicles are always scoped to the calling customer's own garage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/jobs/:
    get:
      operationId: jobs_list
      description: Jobs where the current user is the customer (via request) or assigned
        provider.
      summary: List my jobs
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
  /api/v1/jobs/{id}/:
    get:
      operationId: jobs_retrieve
      description: |-
        Read a job, or request a state transition by sending a new ``status``.

        Transitions are validated against the table in ``apps.jobs.services``; an illegal
        move returns ``409``.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    put:
      operationId: jobs_update
      description: |-
        Read a job, or request a state transition by sending a new ``status``.

        Transitions are validated against the table in ``apps.jobs.services``; an illegal
        move returns ``409``.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    patch:
      operationId: jobs_partial_update
      description: |-
        Read a job, or request a state transition by sending a new ``status``.

        Transitions are validated against the table in ``apps.jobs.services``; an illegal
        move returns ``409``.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/v1/jobs/{job_id}/quotes/:
    get:
      operationId: jobs_quotes_list
      description: |-
        Both parties read the price thread; only the assigned provider adds to it.

        Quoting is optional — a tow price is computable from distance up front, and a trivial
        repair may not be worth the round trip. Where it earns its keep is a repair whose cost
        is unknowable until someone looks (SPEC-015 REQ-5).
      summary: List or submit price quotes for a job
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
    post:
      operationId: jobs_quotes_create
      description: |-
        Both parties read the price thread; only the assigned provider adds to it.

        Quoting is optional — a tow price is computable from distance up front, and a trivial
        repair may not be worth the round trip. Where it earns its keep is a repair whose cost
        is unknowable until someone looks (SPEC-015 REQ-5).
      summary: List or submit price quotes for a job
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuoteList'
          description: ''
        '201':
          content:
            application/json:
              schema:
