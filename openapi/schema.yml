              schema:
                $ref: '#/components/schemas/ProviderVerificationStatus'
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/requests/create/:
    post:
      operationId: requests_create_create
      description: Alias for creating a service request (same as ``POST /jobs/requests/``).
      summary: Create service request
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
          description: ''
  /api/v1/reviews/:
    get:
      operationId: reviews_list
      description: Reviews the caller wrote, plus reviews written about them as a
        provider.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - reviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewList'
          description: ''
    post:
      operationId: reviews_create
      description: Reviews the caller wrote, plus reviews written about them as a
        provider.
      tags:
      - reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/v1/services/nearby/:
    get:
      operationId: services_nearby_retrieve
      description: |-
        Active service categories plus available providers within radius of ``lat``/``lng``.

        Authentication is required: the response contains providers' exact workshop
        coordinates, which must not be enumerable by anonymous callers
        (``specs/008-location.md`` SECGAP-008-1).
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: float
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: float
        required: true
      - in: query
        name: provider_type
        schema:
          type: string
        description: 'Restrict to a trade: mechanic | tow. Providers of type ''both''
          always match.'
      - in: query
        name: radius_km
        schema:
          type: number
          format: float
          default: 50
        description: Radius in km for counting nearby available providers (max 500)
      tags:
      - services
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesNearbyResponse'
          description: ''
components:
  schemas:
    AdminJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        service_request:
          type: string
          format: uuid
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        service_category_name:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatusEnum'
          readOnly: true
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        currency:
          type: string
          readOnly: true
        auto_confirmed:
          type: boolean
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        work_finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - auto_confirmed
      - completed_at
      - created_at
      - currency
      - customer_name
      - final_amount
      - id
      - provider_name
      - service_category_name
      - service_request
      - status
      - work_finished_at
    AdminStatsResponse:
      type: object
      properties:
        users_total:
          type: integer
        customers:
          type: integer
        providers:
          type: integer
        verifications_pending:
          type: integer
        requests_open:
          type: integer
        jobs_active:
          type: integer
        jobs_awaiting_confirmation:
          type: integer
        jobs_completed:
          type: integer
        jobs_auto_confirmed:
          type: integer
        confirmed_amount_total:
          type: string
          nullable: true
        currency:
          type: string
      required:
      - confirmed_amount_total
      - currency
      - customers
      - jobs_active
      - jobs_auto_confirmed
      - jobs_awaiting_confirmation
      - jobs_completed
      - providers
      - requests_open
      - users_total
      - verifications_pending
    AdminUser:
      type: object
      description: |-
        A user as an operator needs to see them, and no more.

        Deliberately omits `password`, tokens, and anything an operator has no business reading.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Phone number
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_phone_verified:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        provider_verification_level:
          type: string
          nullable: true
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - is_email_verified
      - is_phone_verified
      - last_name
      - phone
      - provider_verification_level
      - role
    AdminVerification:
      type: object
      description: |-
        A submission awaiting review.

        **The document images are not exposed.** They are purged on decision (SPEC-013 REQ-8), and
        serving them through a JSON API would put identity documents behind nothing but a URL
        (SEC-GAP-18). A reviewer opens them in Django admin, where access is at least
        staff-gated — recorded as OQ-012-I rather than quietly solved the easy way.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider_id:
          type: string
          format: uuid
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        provider_type:
          type: string
          readOnly: true
        current_level:
          type: string
          readOnly: true
        requested_level:
          allOf:
          - $ref: '#/components/schemas/VerificationLevelEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationSubmissionStatusEnum'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by_label:
          type: string
          nullable: true
          readOnly: true
        review_notes:
          type: string
          readOnly: true
      required:
      - current_level
      - id
      - provider_id
      - provider_name
      - provider_type
      - requested_level
      - review_notes
      - reviewed_at
      - reviewed_by_label
      - status
      - submitted_at
    AdminVerificationReviewRequest:
      type: object
      properties:
        approve:
          type: boolean
        notes:
          type: string
          default: ''
          description: Shown to the provider when a submission is declined.
          maxLength: 2000
      required:
      - approve
    Agency:
      type: object
      description: Read shape. Everything here is read-only by construction.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        provider_type:
          allOf:
          - $ref: '#/components/schemas/ProviderTypeEnum'
          readOnly: true
        verification_level:
          allOf:
          - $ref: '#/components/schemas/VerificationLevelEnum'
          readOnly: true
          description: |-
            Granted to the business; inherited by its active members.

            * `none` - Not verified
            * `phone` - Phone verified
            * `documents` - Documents verified
            * `ghana_card` - Ghana Card verified
        contact_email:
          type: string
          format: email
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        registration_number:
          type: string
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        my_role:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact_email
      - contact_phone
      - created_at
      - id
      - member_count
      - my_role
      - name
      - provider_type
      - registration_number
      - slug
      - updated_at
      - verification_level
    AgencyCreateRequest:
