        * `quote.declined` - Your quote was declined
        * `job.awaiting_confirmation` - Confirm the work and amount
        * `job.completed` - Job completed
        * `job.cancelled` - Job cancelled
        * `job.auto_confirmed` - Job closed automatically
        * `request.cancelled` - Request cancelled
        * `request.expired` - Request expired
