name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# No `working-directory`: this repository's root *is* the web app. The two projects sit in
# sibling directories locally but are separate repositories on GitHub — Autrifix-fe here,
# Autrifix-be for the backend — so `autrifix-web` is not a path that exists in this checkout.

jobs:
  check:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `ci` rather than `install`: it installs exactly the lockfile. The truncated-package
      # incident that broke ESLint came from a partial install, and `ci` starts from a clean
      # node_modules every time.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api-contract:
    # ADR-003 turns backend drift into a compile error, but only while the generated types
    # actually match `openapi/schema.yml`. A stale `api-types.ts` typechecks perfectly and
    # lies exactly as the hand-written types did, so this regenerates and diffs.
    #
    # **What this cannot check:** whether `schema.yml` itself is current with the live
    # backend. That lives in a separate repository, so verifying it from here would need
    # cross-repo credentials. Keeping the schema fresh is `npm run api:gen` against a local
    # backend — see docs/API-INTEGRATION.md.
    name: generated types match the committed schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Regenerate types from the committed schema
        run: npm run api:types

      - name: Fail if the committed types are stale
        run: |
          # --intent-to-add so an *untracked* generated file counts as drift too. Without
          # it `git diff` silently ignores untracked paths and the check passes vacuously.
          git add --intent-to-add openapi/schema.yml lib/api-types.ts
          if ! git diff --exit-code -- openapi/schema.yml lib/api-types.ts; then
            echo "::error::lib/api-types.ts does not match openapi/schema.yml."
            echo "Run 'npm run api:types' and commit the result."
            exit 1
          fi
